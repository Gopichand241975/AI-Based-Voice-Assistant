<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Voice Assistant</title>
<style>
  :root {
    --bg: #0f1220;
    --panel: #171b2e;
    --accent: #6c63ff;
    --accent-2: #35d0ba;
    --text: #eef0fb;
    --muted: #8a90b3;
    --bubble-user: #6c63ff;
    --bubble-bot: #232842;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle at top, #1a1e35, var(--bg) 60%);
    font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .app {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    overflow: hidden;
    border: 1px solid rgba(255,255,255,0.06);
  }
  .header {
    padding: 22px 24px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .header .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: #fff; opacity: 0.9;
    box-shadow: 0 0 12px #fff;
  }
  .header h1 {
    font-size: 18px;
    margin: 0;
    font-weight: 600;
  }
  .header p {
    margin: 2px 0 0;
    font-size: 12.5px;
    color: rgba(255,255,255,0.85);
  }
  #chat {
    height: 420px;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    font-size: 14.5px;
    white-space: pre-wrap;
    animation: pop .18s ease-out;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user {
    align-self: flex-end;
    background: var(--bubble-user);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bubble-bot);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .msg.bot::before {
    content: "🤖 ";
  }
  .suggestions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    padding: 0 20px 14px;
  }
  .chip {
    font-size: 12px;
    color: var(--muted);
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    padding: 6px 10px;
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  form {
    display: flex;
    gap: 10px;
    padding: 16px 20px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  #cmd {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: #10132200;
    background: #12162a;
    color: var(--text);
    font-size: 14.5px;
    outline: none;
  }
  #cmd:focus {
    border-color: var(--accent);
  }
  button {
    padding: 0 20px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #fff;
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: opacity .15s;
  }
  button:hover { opacity: 0.9; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
</style>
</head>
<body>
  <div class="app">
    <div class="header">
      <span class="dot"></span>
      <div>
        <h1>AI Voice Assistant</h1>
        <p>Type a command below and get an instant reply</p>
      </div>
    </div>

    <div id="chat"></div>

    <div class="suggestions">
      <span class="chip" data-cmd="what is the time">time</span>
      <span class="chip" data-cmd="what is the date">date</span>
      <span class="chip" data-cmd="open google">open google</span>
      <span class="chip" data-cmd="who is Albert Einstein">who is Albert Einstein</span>
      <span class="chip" data-cmd="your name">your name?</span>
    </div>

    <form id="form">
      <input id="cmd" type="text" placeholder="Type a command... e.g. what is the time" autocomplete="off" autofocus />
      <button type="submit">Send</button>
    </form>
  </div>

<script>
  const chat = document.getElementById('chat');
  const form = document.getElementById('form');
  const input = document.getElementById('cmd');

  function addMsg(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
  }

  async function sendCommand(text) {
    if (!text.trim()) return;
    addMsg(text, 'user');
    input.value = '';

    const thinking = document.createElement('div');
    thinking.className = 'msg bot';
    thinking.textContent = '...';
    chat.appendChild(thinking);
    chat.scrollTop = chat.scrollHeight;

    try {
      const res = await fetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: text })
      });
      const data = await res.json();
      thinking.remove();
      addMsg(data.reply, 'bot');
    } catch (err) {
      thinking.remove();
      addMsg('Error reaching the assistant server.', 'bot');
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    sendCommand(input.value);
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => sendCommand(chip.dataset.cmd));
  });

  // Greet on load
  addMsg("Hello, I am your voice assistant. How can I help you? (Try the suggestions below, or type your own command.)", 'bot');
</script>
</body>
</html>
