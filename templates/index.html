<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voice Assistant — Console</title>
<style>
  :root{
    --bg: #0d1117;
    --panel: #131a24;
    --line: #1f2937;
    --text: #e6edf3;
    --muted: #7d8b9a;
    --signal: #35e0a1;
    --signal-dim: #1c6b52;
    --user: #4da3ff;
    --mono: "IBM Plex Mono", "Roboto Mono", monospace;
    --sans: "Inter", "Segoe UI", sans-serif;
  }
  *{ box-sizing: border-box; }
  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 20% -10%, #16202c 0%, var(--bg) 55%);
    color: var(--text);
    font-family: var(--sans);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 24px;
  }
  .device{
    width: 100%;
    max-width: 720px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,0.6);
  }
  .titlebar{
    display:flex;
    align-items:center;
    gap:10px;
    padding: 12px 18px;
    border-bottom: 1px solid var(--line);
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background: var(--signal); box-shadow: 0 0 8px var(--signal); }
  .dot.idle{ background:#3a4553; box-shadow:none; }

  .stage{
    padding: 22px 24px 10px;
    text-align:center;
    border-bottom: 1px solid var(--line);
  }
  .stage h1{
    font-family: var(--mono);
    font-size: 15px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 18px;
    font-weight: 500;
  }

  .mic-wrap{
    position: relative;
    width: 96px;
    height: 96px;
    margin: 0 auto 14px;
  }
  .ring{
    position:absolute; inset:0;
    border-radius:50%;
    border: 1px solid var(--signal-dim);
    opacity: 0;
    transform: scale(0.8);
  }
  .listening .ring{
    animation: pulse 1.6s ease-out infinite;
  }
  .ring:nth-child(2){ animation-delay: 0.5s; }
  @keyframes pulse{
    0%{ opacity: 0.6; transform: scale(0.8);}
    100%{ opacity:0; transform: scale(1.6);}
  }
  .mic-btn{
    position:relative;
    z-index:2;
    width: 96px; height: 96px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #0f151d;
    color: var(--signal);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    transition: border-color 0.2s, transform 0.15s;
  }
  .mic-btn:hover{ border-color: var(--signal-dim); }
  .mic-btn:active{ transform: scale(0.96); }
  .listening .mic-btn{
    border-color: var(--signal);
    box-shadow: 0 0 30px -6px var(--signal);
  }
  .mic-btn svg{ width: 34px; height: 34px; }

  .status-line{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
    margin-bottom: 18px;
  }
  .listening .status-line{ color: var(--signal); }

  .typed-row{
    display:flex;
    gap:8px;
    padding-bottom: 20px;
  }
  .typed-row input{
    flex:1;
    background: #0f151d;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    color: var(--text);
    font-family: var(--sans);
    font-size: 13px;
    outline: none;
  }
  .typed-row input:focus{ border-color: var(--user); }
  .typed-row button{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 8px;
    padding: 0 16px;
    font-family: var(--sans);
    font-size: 13px;
    cursor:pointer;
  }
  .typed-row button:hover{ border-color: var(--user); color: var(--user); }

  .log{
    max-height: 320px;
    overflow-y: auto;
    padding: 18px 24px 24px;
    display:flex;
    flex-direction:column;
    gap: 14px;
  }
  .log::-webkit-scrollbar{ width: 6px; }
  .log::-webkit-scrollbar-thumb{ background: var(--line); border-radius: 4px; }

  .row{ display:flex; gap:10px; align-items:flex-start; }
  .tag{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.06em;
    padding: 2px 6px;
    border-radius: 4px;
    flex-shrink:0;
    margin-top: 2px;
  }
  .row.in .tag{ color: var(--user); border: 1px solid #1d3a5c; background: #0f1c2c; }
  .row.out .tag{ color: var(--signal); border: 1px solid var(--signal-dim); background: #0e1a16; }
  .row p{ margin:0; font-size: 14px; line-height: 1.5; }
  .row.in p{ color: var(--text); }
  .row.out p{ color: #c9d5df; }

  .empty{
    font-family: var(--mono);
    font-size: 12px;
    color: var(--muted);
    text-align:center;
    padding: 10px 0 4px;
  }

  .hint{
    font-family: var(--mono);
    font-size: 10.5px;
    color: #4a5566;
    text-align:center;
    padding: 0 24px 18px;
    line-height: 1.6;
  }
</style>
</head>
<body data-greeting="{{ greeting | e }}">

<div class="device" id="device">
  <div class="titlebar">
    <span class="dot idle" id="statusDot"></span>
    <span id="titleText">VOICE ASSISTANT · IDLE</span>
  </div>

  <div class="stage" id="stage">
    <h1>Tap to speak, or type a command</h1>
    <div class="mic-wrap">
      <div class="ring"></div>
      <div class="ring"></div>
      <button class="mic-btn" id="micBtn" title="Start listening">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 10a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="19" x2="12" y2="22"></line>
        </svg>
      </button>
    </div>
    <div class="status-line" id="statusLine">Ready</div>

    <div class="typed-row">
      <input id="typedInput" type="text" placeholder="e.g. what time is it / who is Marie Curie" />
      <button id="sendBtn">Send</button>
    </div>
  </div>

  <div class="log" id="log">
    <div class="empty" id="emptyNote">— conversation will appear here —</div>
  </div>

  <div class="hint">
    IN = what you said/typed &nbsp;·&nbsp; OUT = assistant's reply, also spoken aloud<br>
    Voice input works best in Chrome. No mic? Just type and hit Send.
  </div>
</div>

<script>
const micBtn = document.getElementById('micBtn');
const sendBtn = document.getElementById('sendBtn');
const typedInput = document.getElementById('typedInput');
const log = document.getElementById('log');
const emptyNote = document.getElementById('emptyNote');
const device = document.getElementById('device');
const statusDot = document.getElementById('statusDot');
const statusLine = document.getElementById('statusLine');
const titleText = document.getElementById('titleText');

function addRow(kind, text){
  if(emptyNote) emptyNote.remove();
  const row = document.createElement('div');
  row.className = 'row ' + kind;
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = kind === 'in' ? 'IN' : 'OUT';
  const p = document.createElement('p');
  p.textContent = text;
  row.appendChild(tag);
  row.appendChild(p);
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.0;
  window.speechSynthesis.speak(utter);
}

async function sendCommand(command){
  if(!command) return;
  addRow('in', command);
  statusLine.textContent = 'Thinking…';
  try {
    const res = await fetch('/process', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({command})
    });
    const data = await res.json();
    addRow('out', data.reply);
    speak(data.reply);
    if(data.action && data.action.type === 'open_url'){
      window.open(data.action.url, '_blank');
    }
    statusLine.textContent = 'Ready';
  } catch(err){
    addRow('out', 'Could not reach the assistant server.');
    statusLine.textContent = 'Ready';
  }
}

sendBtn.addEventListener('click', () => {
  const val = typedInput.value.trim();
  typedInput.value = '';
  sendCommand(val);
});
typedInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){ sendBtn.click(); }
});

// --- Web Speech API (voice input) ---
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'en-US';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    device.classList.add('listening');
    statusDot.classList.remove('idle');
    titleText.textContent = 'VOICE ASSISTANT · LISTENING';
    statusLine.textContent = 'Listening…';
  };

  recognition.onresult = (event) => {
    const said = event.results[0][0].transcript;
    sendCommand(said);
  };

  recognition.onerror = (event) => {
    console.error('SpeechRecognition error:', event.error);
    let msg;
    switch(event.error){
      case 'not-allowed':
      case 'service-not-allowed':
        msg = 'Microphone permission is blocked. Click the mic/lock icon in the address bar and allow it, then try again.';
        break;
      case 'no-speech':
        msg = 'No speech detected. Click the mic and speak right away.';
        break;
      case 'audio-capture':
        msg = 'No microphone found. Check that one is connected and selected as default.';
        break;
      case 'network':
        msg = 'Network error reaching the speech service. Check your internet connection.';
        break;
      default:
        msg = 'Mic error: ' + event.error + '. Try again or type your command below.';
    }
    statusLine.textContent = msg;
  };

  recognition.onend = () => {
    listening = false;
    device.classList.remove('listening');
    statusDot.classList.add('idle');
    titleText.textContent = 'VOICE ASSISTANT · IDLE';
    if(statusLine.textContent === 'Listening…') statusLine.textContent = 'Ready';
  };

  micBtn.addEventListener('click', async () => {
    if(listening){
      recognition.stop();
      return;
    }
    // Explicitly request mic permission first so we get a clear prompt
    // and a clear error instead of the recognizer failing silently.
    try{
      const stream = await navigator.mediaDevices.getUserMedia({audio: true});
      stream.getTracks().forEach(t => t.stop()); // we only needed the permission
      recognition.start();
    } catch(err){
      console.error('getUserMedia error:', err);
      if(err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError'){
        statusLine.textContent = 'Microphone permission denied. Allow it via the icon in the address bar, then try again.';
      } else if(err.name === 'NotFoundError'){
        statusLine.textContent = 'No microphone found on this device.';
      } else {
        statusLine.textContent = 'Could not access microphone: ' + err.name;
      }
    }
  });
} else {
  micBtn.disabled = true;
  micBtn.title = 'Voice input not supported in this browser — please type instead.';
  statusLine.textContent = 'Voice input unsupported here — type your command below.';
}

// Greet on load
window.addEventListener('load', () => {
  const greeting = document.body.dataset.greeting;
  addRow('out', greeting);
  speak(greeting);
});
</script>

</body>
</html>
